<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Journey in Desert</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
}

/* Desert Background */
.desert{
    width:100%;
    height:100vh;
    position:relative;
    background:linear-gradient(to bottom,#87CEEB 0%,#87CEEB 40%,#e6c068 40%,#d9a441 100%);
}

/* Sun */
.sun{
    width:100px;
    height:100px;
    background:gold;
    border-radius:50%;
    position:absolute;
    top:50px;
    right:100px;
    box-shadow:0 0 50px yellow;
}

/* Sand Dunes */
.dune{
    position:absolute;
    bottom:0;
    width:500px;
    height:200px;
    background:#c9902d;
    border-radius:50%;
}

.d1{left:-100px;}
.d2{left:300px;}
.d3{left:700px;}

/* Oasis Destination */
.oasis{
    position:absolute;
    right:120px;
    bottom:150px;
}

.water{
    width:120px;
    height:60px;
    background:deepskyblue;
    border-radius:50%;
}

.tree{
    width:20px;
    height:80px;
    background:brown;
    position:absolute;
    left:40px;
    bottom:30px;
}

.leaves{
    width:70px;
    height:70px;
    background:green;
    border-radius:50%;
    position:absolute;
    left:15px;
    bottom:90px;
}

/* Snake */
.snake{
    position:absolute;
    bottom:120px;
    left:-200px;
    width:180px;
    height:25px;
    animation:travel 15s linear infinite;
}

.segment{
    width:25px;
    height:25px;
    background:green;
    border-radius:50%;
    position:absolute;
}

.segment:nth-child(1){left:0;}
.segment:nth-child(2){left:20px;}
.segment:nth-child(3){left:40px;}
.segment:nth-child(4){left:60px;}
.segment:nth-child(5){left:80px;}
.segment:nth-child(6){left:100px;}
.segment:nth-child(7){left:120px;}
.segment:nth-child(8){left:140px;}

.eye{
    width:4px;
    height:4px;
    background:black;
    border-radius:50%;
    position:absolute;
    top:7px;
    left:8px;
}

@keyframes travel{
    0%{
        left:-200px;
        transform:translateY(0px);
    }
    25%{
        transform:translateY(-10px);
    }
    50%{
        transform:translateY(10px);
    }
    75%{
        transform:translateY(-10px);
    }
    100%{
        left:85%;
        transform:translateY(0px);
    }
}
</style>
</head>
<body>

<div class="desert">

    <div class="sun"></div>

    <div class="dune d1"></div>
    <div class="dune d2"></div>
    <div class="dune d3"></div>

    <div class="oasis">
        <div class="water"></div>
        <div class="tree"></div>
        <div class="leaves"></div>
    </div>

    <div class="snake">
        <div class="segment"><div class="eye"></div></div>
        <div class="segment"></div>
        <div class="segment"></div>
        <div class="segment"></div>
        <div class="segment"></div>
        <div class="segment"></div>
        <div class="segment"></div>
        <div class="segment"></div>
    </div>

</div>

</body>
</html>
