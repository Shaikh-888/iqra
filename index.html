<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy To Solar System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
    height:100vh;
    perspective:1000px;
}

.space{
    position:relative;
    width:100%;
    height:100vh;
    transform-style:preserve-3d;
}

/* Stars */
.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:zoom 15s linear infinite;
}

@keyframes zoom{
    from{
        transform:translateZ(-2000px);
        opacity:0;
    }
    to{
        transform:translateZ(1000px);
        opacity:1;
    }
}

/* Galaxy */
.galaxy{
    position:absolute;
    top:50%;
    left:50%;
    width:500px;
    height:500px;
    margin-left:-250px;
    margin-top:-250px;
    border-radius:50%;
    background:
    radial-gradient(circle,
    rgba(255,255,255,1) 0%,
    rgba(180,180,255,0.8) 20%,
    rgba(100,100,255,0.2) 50%,
    transparent 80%);
    animation:galaxyZoom 20s linear forwards;
}

@keyframes galaxyZoom{
    0%{
        transform:translateZ(-1500px) scale(0.2) rotate(0deg);
    }
    100%{
        transform:translateZ(300px) scale(3) rotate(360deg);
        opacity:0;
    }
}

/* Solar System */
.solar-system{
    position:absolute;
    top:50%;
    left:50%;
    width:600px;
    height:600px;
    transform:translate(-50%,-50%);
    opacity:0;
    animation:showSolar 20s forwards;
}

@keyframes showSolar{
    0%,70%{
        opacity:0;
    }
    100%{
        opacity:1;
    }
}

.sun{
    position:absolute;
    width:80px;
    height:80px;
    background:gold;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 50px orange;
}

.orbit{
    position:absolute;
    border:1px solid rgba(255,255,255,0.2);
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.earth-orbit{
    width:250px;
    height:250px;
    animation:rotate 12s linear infinite;
}

.mars-orbit{
    width:350px;
    height:350px;
    animation:rotate 18s linear infinite;
}

.planet{
    position:absolute;
    border-radius:50%;
}

.earth{
    width:20px;
    height:20px;
    background:deepskyblue;
    top:-10px;
    left:50%;
}

.mars{
    width:16px;
    height:16px;
    background:orangered;
    top:-8px;
    left:50%;
}

@keyframes rotate{
    from{
        transform:translate(-50%,-50%) rotate(0deg);
    }
    to{
        transform:translate(-50%,-50%) rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="space">

    <div class="galaxy"></div>

    <div class="solar-system">
        <div class="sun"></div>

        <div class="orbit earth-orbit">
            <div class="planet earth"></div>
        </div>

        <div class="orbit mars-orbit">
            <div class="planet mars"></div>
        </div>
    </div>

</div>

<script>
for(let i=0;i<300;i++){
    let star=document.createElement('div');
    star.className='star';

    star.style.left=Math.random()*100+'vw';
    star.style.top=Math.random()*100+'vh';

    star.style.animationDuration=
    (10+Math.random()*10)+'s';

    document.querySelector('.space').appendChild(star);
}
</script>

</body>
</html>
