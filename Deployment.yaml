apiVersion: apps/v1
kind: Deployment
metadata:
  name: iqra-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iqra
  template:
    metadata:
      labels:
        app: iqra
    spec:
      containers:
      - name: iqra
        image: your-dockerhub-username/apache-web:latest
        ports:
        - containerPort: 80
